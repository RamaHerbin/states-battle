<!doctype html>
<html lang="fr" style="background: #21295c">

		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>States Battle</title>
		<meta
			name="description"
			content="La France et la Grande-Bretagne cachent leurs troupes sur le territoire américain. Démasque celles de l'ennemi en premier."

		<meta name="theme-color" content="#21295c" />
		<link rel="canonical" href="https://states-battle.vercel.app/" />
		<link rel="icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="States Battle" />
		<meta property="og:url" content="https://states-battle.vercel.app/" />

			property="og:description"
			content="La France et la Grande-Bretagne cachent leurs troupes sur le territoire américain. Démasque celles de l'ennemi en premier."

		<meta
			property="og:image:alt"
			content="States Battle : la carte des États-Unis avec les troupes cachées de la France et de la Grande-Bretagne"
		/>

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="States Battle" />

			name="twitter:description"
			content="La France et la Grande-Bretagne cachent leurs troupes sur le territoire américain. Démasque celles de l'ennemi en premier."
		/>

		<!-- Fonts of the 2023 Figma, self-hosted (see app.css): Karantina for titles, Khand for text. -->
		<link rel="preload" href="/fonts/karantina-400-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/khand-400-latin.woff2" as="font" type="font/woff2" crossorigin />
		<!-- Umami (stats.rama.app): add the script with this site's website id once created; see apps/exp/src/app.html for the pattern. -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" style="background: #21295c">
		<div style="display: contents">%sveltekit.body%</div>
